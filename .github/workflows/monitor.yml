name: RE1-Monitor

on:
  # Ersatz-Zeitplan: GitHub startet geplante Läufe oft verspätet oder gar nicht.
  # Hauptauslöser ist cron-job.org (stündlich um :53) über workflow_dispatch, siehe README.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# nie zwei Läufe gleichzeitig, sonst kollidieren die Commits auf dem Branch "data"
concurrency:
  group: re1-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Branch "data" nach ./data holen
        run: |
          if git fetch --depth 1 origin data; then
            git worktree add data FETCH_HEAD
            git -C data switch -C data
          else
            git worktree add --detach data
            git -C data switch --orphan data
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sammler
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: node collect.mjs

      # auch nach einem fehlgeschlagenen Lauf, damit runs.csv den Fehler zeigt
      - name: Daten speichern
        if: always()
        working-directory: data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Daten $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
            git push origin HEAD:data
          fi
